<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Task Manager: plan your coursework, track deadlines and finish what matters first.">
    <title>Student Task Manager</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a class="skip-link" href="#task-form">Skip to the add task form</a>

    <div class="app">

        <!-- Top bar -->
        <nav class="topbar" aria-label="Application">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                </span>
                <span class="brand-name">Student Task Manager</span>
            </div>
            <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to dark theme" title="Switch theme">
                <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </nav>

        <!-- Hero: greeting + progress -->
        <header class="hero">
            <div class="hero-copy">
                <p class="hero-date" id="today-date"></p>
                <h1 id="greeting">Welcome back</h1>
                <p class="hero-message" id="hero-message">Add your first task to get started.</p>

                <dl class="hero-stats" role="status" aria-live="polite">
                    <div><dt>Total</dt><dd id="stat-total">0</dd></div>
                    <div><dt>Active</dt><dd id="stat-active">0</dd></div>
                    <div><dt>Done</dt><dd id="stat-completed">0</dd></div>
                    <div><dt>Overdue</dt><dd id="stat-overdue">0</dd></div>
                </dl>
            </div>

            <div class="ring" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-ring">
                <svg viewBox="0 0 120 120" aria-hidden="true">
                    <circle class="ring-track" cx="60" cy="60" r="52"/>
                    <circle class="ring-fill" id="ring-fill" cx="60" cy="60" r="52"/>
                </svg>
                <div class="ring-label">
                    <span class="ring-percent" id="ring-percent">0%</span>
                    <span class="ring-caption">complete</span>
                </div>
            </div>
        </header>

        <main class="content">

            <!-- Add task -->
            <section class="card" aria-labelledby="form-heading">
                <h2 id="form-heading" class="card-title">Add a task</h2>

                <form id="task-form" autocomplete="off" novalidate>
                    <div class="form-grid">
                        <div class="field span-2">
                            <label for="task-title">Title</label>
                            <input type="text" id="task-title" name="title" placeholder="e.g., Finish Assignment 2" maxlength="80" required>
                        </div>

                        <div class="field">
                            <label for="task-category">Subject</label>
                            <input type="text" id="task-category" name="category" placeholder="e.g., Data Structures" maxlength="24">
                        </div>

                        <div class="field">
                            <label for="task-due">Due date</label>
                            <input type="date" id="task-due" name="due">
                        </div>

                        <div class="field">
                            <label for="task-priority">Priority</label>
                            <select id="task-priority" name="priority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>

                        <div class="field span-2">
                            <label for="task-desc">Notes</label>
                            <textarea id="task-desc" name="description" rows="3" placeholder="What needs to be done? Add steps, links or reminders." maxlength="300" required></textarea>
                        </div>
                    </div>

                    <p id="form-error" class="form-error" role="alert" hidden></p>

                    <button type="submit" id="add-btn" class="btn-primary">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                        Add task
                    </button>
                </form>
            </section>

            <!-- Search, filter, sort -->
            <section class="toolbar" aria-label="Find and organize tasks">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input type="search" id="search-input" placeholder="Search by title, subject or notes" aria-label="Search tasks" autocomplete="off">
                </div>

                <div class="toolbar-row">
                    <div class="pills" role="group" aria-label="Show tasks">
                        <button type="button" class="pill active" data-filter="all" aria-pressed="true">All <span id="count-all">0</span></button>
                        <button type="button" class="pill" data-filter="active" aria-pressed="false">Active <span id="count-active">0</span></button>
                        <button type="button" class="pill" data-filter="completed" aria-pressed="false">Done <span id="count-completed">0</span></button>
                    </div>

                    <div class="sort">
                        <label for="sort-select">Sort by</label>
                        <select id="sort-select">
                            <option value="newest">Newest first</option>
                            <option value="due">Due date</option>
                            <option value="priority">Priority</option>
                        </select>
                    </div>
                </div>
            </section>

            <!-- Task list -->
            <section class="list-section" aria-labelledby="list-heading">
                <h2 id="list-heading" class="visually-hidden">Your tasks</h2>

                <ul id="task-list" class="task-list">
                    <!-- Task cards are rendered here by script.js -->
                </ul>

                <div id="empty-state" class="empty-state" hidden>
                    <div class="empty-art" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                    </div>
                    <p class="empty-title" id="empty-title"></p>
                    <p class="empty-text" id="empty-text"></p>
                </div>

                <div class="list-footer">
                    <span id="list-summary">0 tasks</span>
                    <button type="button" id="clear-completed" class="link-btn" disabled>Clear completed</button>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>Built by two students with Git and GitHub. Your tasks are saved in this browser.</p>
        </footer>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
