<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <!-- Application Header -->
        <header>
            <h1>📚 Student Task Manager</h1>
            <p>Organize, track, and search your academic tasks efficiently.</p>
        </header>

        <!-- Live Task Search Section (Task Search Feature) -->
        <section class="search-section">
            <h2>🔍 Search Tasks</h2>
            <div class="form-group">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Type a keyword to filter tasks..." 
                    autocomplete="off"
                >
            </div>
        </section>

        <!-- New Task Form Section -->
        <section class="form-section">
            <h2>➕ Add New Task</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-title">Task Title</label>
                    <input 
                        type="text" 
                        id="task-title" 
                        placeholder="e.g., Complete Assignment 2" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="task-desc">Task Description</label>
                    <textarea 
                        id="task-desc" 
                        rows="3" 
                        placeholder="Enter task details or instructions..." 
                        required
                    ></textarea>
                </div>

                <button type="submit" id="add-btn">Add Task</button>
            </form>
        </section>

        <!-- Dynamic Task List Container -->
        <section class="list-section">
            <h2>📋 Task List</h2>
            <ul id="task-list" class="task-list">
                <!-- Dynamic task cards will be rendered here by script.js -->
            </ul>
        </section>
    </main>

    <!-- JavaScript Application Logic -->
    <script src="script.js"></script>
</body>
</html>
