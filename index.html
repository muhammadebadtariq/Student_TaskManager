
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Student Task Manager</h1>
            <p>Organize, search, and track your daily academic tasks effortlessly.</p>
        </header>

        <!-- Search Bar Section (Student 2 Feature) -->
        <section class="search-section">
            <input 
                type="text" 
                id="search-input" 
                placeholder="🔍 Search tasks by title or description..."
            >
        </section>

        <!-- Task Form Section (Student 1 Feature) -->
        <section class="form-section">
            <h2>Add New Task</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-title">Task Title</label>
                    <input 
                        type="text" 
                        id="task-title" 
                        placeholder="e.g., Complete Git Assignment" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="task-desc">Task Description</label>
                    <textarea 
                        id="task-desc" 
                        rows="3" 
                        placeholder="e.g., Take required screenshots and submit Word doc" 
                        required
                    ></textarea>
                </div>

                <button type="submit" id="add-btn">➕ Add Task</button>
            </form>
        </section>

        <!-- Task Display List Section -->
        <section class="task-section">
            <h2>Your Tasks</h2>
            <ul id="task-list" class="task-list">
                <!-- Dynamic task cards will be rendered here via script.js -->
            </ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
