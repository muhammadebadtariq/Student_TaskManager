<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">
        <!-- Application Header -->
        <header class="app-header">
            <div class="brand">
                <span class="brand-icon">✨</span>
                <div>
                    <h1>TaskMaster</h1>
                    <p>Elevate your academic workflow and productivity.</p>
                </div>
            </div>
            
            <!-- Dynamic Stats Bar -->
            <div class="stats-bar">
                <div class="stat-pill">
                    <span class="stat-label">Total</span>
                    <span id="stat-total" class="stat-value">0</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">Completed</span>
                    <span id="stat-completed" class="stat-value">0</span>
                </div>
            </div>
        </header>

        <!-- New Task Form Section -->
        <section class="card form-section">
            <h2 class="section-title">
                <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                Create New Task
            </h2>
            <form id="task-form">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="task-title">Task Title</label>
                        <input 
                            type="text" 
                            id="task-title" 
                            placeholder="e.g., Complete CS50 Data Structures Assignment" 
                            required
                            autocomplete="off"
                        >
                    </div>

                    <div class="form-group">
                        <label for="task-priority">Priority Level</label>
                        <select id="task-priority" class="select-input">
                            <option value="medium">⚡ Medium Priority</option>
                            <option value="high">🔥 High Priority</option>
                            <option value="low">🌱 Low Priority</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="task-desc">Description & Notes</label>
                        <textarea 
                            id="task-desc" 
                            rows="2" 
                            placeholder="Add key details, links, or sub-tasks..." 
                            required
                        ></textarea>
                    </div>
                </div>

                <button type="submit" id="add-btn" class="btn btn-primary">
                    <span>Add Task</span>
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>
        </section>

        <!-- Live Task Search Section -->
        <section class="search-section">
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Search tasks by title or content..." 
                    autocomplete="off"
                >
            </div>
        </section>

        <!-- Dynamic Task List Container -->
        <section class="list-section">
            <div class="list-header">
                <h2 class="section-title">
                    <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
                    Your Tasks
                </h2>
            </div>
            
            <ul id="task-list" class="task-list">
                <!-- Task items dynamically appended here -->
            </ul>

            <!-- Empty State Fallback -->
            <div id="empty-state" class="empty-state">
                <div class="empty-icon">🎯</div>
                <h3>All clear!</h3>
                <p>No tasks found. Add a task above to get started.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
